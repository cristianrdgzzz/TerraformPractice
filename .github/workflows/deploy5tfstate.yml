name: 'Despliegue tfstatefilelayout-global'
 
on: 
  workflow_dispatch: 
    inputs: 
      action: 
        description: 'Acción a realizar' 
        required: true 
        type: choice 
        options: 
        - 'apply' 
        - 'destroy' 
        - 'plan'
 
jobs: 
  terraform: 
    name: 'Terraform ${{ inputs.action }}' 
    runs-on: ubuntu-latest 
    env:
      TF_VAR_resource_group_name: 'rg-tfstate-practice'
      TF_VAR_storage_account_name: 'sttfpractice2026'
      TF_VAR_cosmos_db_account_name: 'cosmostfpractice2026'
 
    defaults: 
      run: 
        working-directory: ./code/terraform/03-terraform-state/file-layout-example-azure/global/storage
 
    steps: 
    - name: Checkout del código 
      uses: actions/checkout@v4 
 
    - name: Login en Azure 
      uses: azure/login@v2 
      with: 
        creds: ${{ secrets.AZURE_CREDENTIALS }} 
 
    - name: Instalar Terraform 
      uses: hashicorp/setup-terraform@v3 
 
    - name: Terraform Init 
      run: terraform init 

    - name: Terraform Plan
      if: ${{ inputs.action == 'plan' }}
      run: terraform plan  
 
    - name: Terraform Apply 
      if: ${{ inputs.action == 'apply' }} 
      run: terraform apply -auto-approve 
 
    - name: Terraform Destroy 
      if: ${{ inputs.action == 'destroy' }} 
      run: terraform destroy -auto-approve 
 